        <script defer src="https://www.desmos.com/api/v1.12/calculator.js?apiKey=e87ef15dcd7241adb4291a376ce81c59"></script>
        <div id="calculator" style="width: 800px; height: 400px; margin: 0px auto;"></div><br>
        <script type="module">
            var elt = document.getElementById('calculator');
            var calculator = Desmos.GraphingCalculator(elt, {brailleControls: false, backgroundColor: '#000', textColor: '#fff', invertedColorsControl: false, audio: false, muted: false, lockViewport: true, border: false, zoomButtons: false, degreeMode: false, pointsOfInterest: false, colors: {}, showGrid: false, showXAxis: false, showYAxis: false, expressions: false, settingsMenu: false});
            calculator.setMathBounds({left: -3, right: 3, bottom: -1.5, top: 1.5});
            calculator.setExpression({id: "0", latex: "t_0=0", sliderBounds: { min: "0", max: "1"}, playing: true});
            calculator.setState((state => (Object.assign(state.expressions.list[0].slider, {loopMode: "LOOP_FORWARD"}), state))(calculator.getState()));
            calculator.setExpression({id: "1", latex: "c_{r}\\left(x\\right)=\\left\\{0\\le x\\le1:\\left\\{x\\le\\frac{1}{6}:1,\\left\\{x\\le\\frac{2}{6}:-6x+2,\\left\\{x\\le\\frac{3}{6}:0,\\left\\{x\\le\\frac{4}{6}:0,\\left\\{x\\le\\frac{5}{6}:6x-4,1\\right\\}\\right\\}\\right\\}\\right\\}\\right\\}\\right\\}", hidden: true});
            calculator.setExpression({id: "2", latex: "c_{g}\\left(x\\right)=\\left\\{0\\le x\\le1:\\left\\{x\\le\\frac{1}{6}:6x,\\left\\{x\\le\\frac{2}{6}:1,\\left\\{x\\le\\frac{3}{6}:1,\\left\\{x\\le\\frac{4}{6}:-6x+4,0\\right\\}\\right\\}\\right\\}\\right\\}\\right\\}", hidden: true});
            calculator.setExpression({id: "3", latex: "c_{b}\\left(x\\right)=\\left\\{0\\le x\\le1:\\left\\{x\\le\\frac{1}{6}:0,\\left\\{x\\le\\frac{2}{6}:0,\\left\\{x\\le\\frac{3}{6}:6x-2,\\left\\{x\\le\\frac{4}{6}:1,\\left\\{x\\le\\frac{5}{6}:1,-6x+6\\right\\}\\right\\}\\right\\}\\right\\}\\right\\}\\right\\}", hidden: true});
            calculator.setExpression({id: "4", latex: "c_{0}=\\operatorname{rgb}\\left(255c_{r}\\left(t_{0}\\right),255c_{g}\\left(t_{0}\\right),255c_{b}\\left(t_{0}\\right)\\right)"});
            calculator.setExpression({id: "5", latex: "c_{1}=\\operatorname{rgb}\\left(255c_{b}\\left(t_{0}\\right),255c_{r}\\left(t_{0}\\right),255c_{g}\\left(t_{0}\\right)\\right)"});
            calculator.setExpression({id: "6", latex: "c_{2}=\\operatorname{rgb}\\left(255c_{g}\\left(t_{0}\\right),255c_{b}\\left(t_{0}\\right),255c_{r}\\left(t_{0}\\right)\\right)"});
            calculator.setExpression({id: "7", latex: "c_{3}=\\operatorname{rgb}\\left(255-255c_{r}\\left(t_{0}\\right),255-255c_{g}\\left(t_{0}\\right),255-255c_{b}\\left(t_{0}\\right)\\right)"});
            calculator.setExpression({id: "8", latex: "c_{4}=\\operatorname{rgb}\\left(255-255c_{b}\\left(t_{0}\\right),255-255c_{r}\\left(t_{0}\\right),255-255c_{g}\\left(t_{0}\\right)\\right)"});
            calculator.setExpression({id: "9", latex: "c_{5}=\\operatorname{rgb}\\left(255-255c_{g}\\left(t_{0}\\right),255-255c_{b}\\left(t_{0}\\right),255-255c_{r}\\left(t_{0}\\right)\\right)"});
            calculator.setExpression({id: "10", latex: "\\left(\\sin\\left(4\\left(t+\\frac{\\pi t_{0}}{4}\\right)\\right)\\cos t,\\sin\\left(4\\left(t+\\frac{\\pi t_{0}}{4}\\right)\\right)\\sin t\\right)", parametricDomain: {max: "2\\pi"}});
            calculator.setState((state => (Object.assign(state.expressions.list[10], {colorLatex: "c_{0}"}), state))(calculator.getState()));
            calculator.setExpression({id: "11", latex: "\\frac{1}{3}\\left(\\sin\\left(3\\left(t-\\frac{\\pi t_{0}}{3}\\right)\\right)\\cos t+6,\\sin\\left(3\\left(t-\\frac{\\pi t_{0}}{3}\\right)\\right)\\sin t+3\\right)", parametricDomain: {max: "2\\pi"}});
            calculator.setState((state => (Object.assign(state.expressions.list[11], {colorLatex: "c_{1}"}), state))(calculator.getState()));
            calculator.setExpression({id: "12", latex: "\\frac{1}{3}\\left(\\sin\\left(3\\left(t-\\frac{\\pi t_{0}}{3}+\\pi\\right)\\right)\\cos t+6,\\sin\\left(3\\left(t-\\frac{\\pi t_{0}}{3}+\\pi\\right)\\right)\\sin t+3\\right)", parametricDomain: {max: "2\\pi"}});
            calculator.setState((state => (Object.assign(state.expressions.list[12], {colorLatex: "c_{1}"}), state))(calculator.getState()));
            calculator.setExpression({id: "13", latex: "\\frac{1}{2}\\left(\\sin\\left(2\\left(t-\\frac{\\pi t_{0}}{2}\\right)\\right)\\cos t-4.5,\\sin\\left(2\\left(t-\\frac{\\pi t_{0}}{2}\\right)\\right)\\sin t-1\\right)", parametricDomain: {max: "2\\pi"}});
            calculator.setState((state => (Object.assign(state.expressions.list[13], {colorLatex: "c_{2}"}), state))(calculator.getState()));
            calculator.setExpression({id: "14", latex: "\\frac{1}{4}\\left(\\sin\\left(3\\left(t-\\frac{2\\pi t_{0}}{3}\\right)\\right)\\cos t-7,\\sin\\left(3\\left(t+\\frac{2\\pi t_{0}}{3}\\right)\\right)\\sin t+5\\right)", parametricDomain: {max: "2\\pi"}});
            calculator.setState((state => (Object.assign(state.expressions.list[14], {colorLatex: "c_{3}"}), state))(calculator.getState()));
            calculator.setExpression({id: "15", latex: "\\frac{1}{3}\\left(\\sin\\left(7\\left(t+\\frac{2\\pi t_{0}}{7}\\right)\\right)\\cos t+4,\\sin\\left(7\\left(t+\\frac{2\\pi t_{0}}{7}\\right)\\right)\\sin t-3\\right)", parametricDomain: {max: "2\\pi"}});
            calculator.setState((state => (Object.assign(state.expressions.list[15], {colorLatex: "c_{4}"}), state))(calculator.getState()));
            calculator.setExpression({id: "16", latex: "\\frac{2}{5}\\left(\\sin\\left(2\\left(t+\\pi t_{0}\\right)\\right)\\cos t+6,\\sin\\left(2\\left(t-\\pi t_{0}\\right)\\right)\\sin t-0.5\\right)", parametricDomain: {max: "2\\pi"}});
            calculator.setState((state => (Object.assign(state.expressions.list[16], {colorLatex: "c_{5}"}), state))(calculator.getState()));
        </script>

        <script>
            function set_lang(language) {
                document.querySelectorAll("[data-en][data-es]").forEach(element => {
                    const value = element.dataset[language];
                    const attribute = element.dataset.attr;
                    if (attribute) {
                        element.setAttribute(attribute, value);
                    } else if (element.hasAttribute("data-html")) {
                        element.innerHTML = value;
                    } else {
                        element.textContent = value;
                    }
                });
                document.documentElement.lang = language;
                localStorage.setItem("language", language);
            }
            function init_lang() {
                const saved = localStorage.getItem("language");
                if (saved === "en" || saved === "es") {
                    return saved;
                }
                if (navigator.language.toLowerCase().startsWith("es")) {
                    return "es";
                }
                return "en";
            }
            function toggle_lang() {
                const current = document.documentElement.lang;
                set_lang(current === "en" ? "es" : "en");
            }
            set_lang(init_lang());
        </script>
